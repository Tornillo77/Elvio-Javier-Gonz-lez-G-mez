<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#ffffff; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <!-- Fondo Blanco Limpio -->
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff" />

  <!-- Encabezado con Listón Técnico 'SENTIDO DE BOBINADO FLEXOGRÁFICO' -->
  <g transform="translate(260, 30)">
    <path d="M 0,0 L 480,0 L 465,24 L 480,48 L 0,48 L 15,24 Z" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M 15,6 L 465,6" stroke="#1e293b" stroke-width="1" />
    <path d="M 15,42 L 465,42" stroke="#1e293b" stroke-width="1" />
    <text x="240" y="32" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="3" font-family="'Times New Roman', serif, system-ui">
      SENTIDO DE BOBINADO FLEXOGRÁFICO
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- FILA 1: BOBINADO EXTERIOR (1, 2, 3, 4)                  -->
  <!-- El papel pasa por ENCIMA de la bobina                    -->
  <!-- ======================================================== -->

  <!-- POSICIÓN 1: Bobinado exterior - Salida izquierda -->
  <g transform="translate(30, 105)">
    <!-- Ilustración de Bobina (Turquesa #009688) -->
    <g transform="translate(10, 0)">
      <!-- Cuerpo inferior del cilindro visible por debajo del papel -->
      <path d="M 112,74 L 112,88 C 112,104 168,104 168,88 L 168,32 Z" fill="#009688" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Banda de papel desenrollada pasando POR ENCIMA de la bobina -->
      <path d="M 10,20 L 140,20 C 156,20 168,25 168,32 L 168,74 C 168,80 154,84 132,84 L 112,84 L 112,74 L 10,74 Z" fill="#009688" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Tapa superior elíptica blanca con buje negro (bobinado exterior) -->
      <ellipse cx="140" cy="32" rx="28" ry="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
      <ellipse cx="140" cy="32" rx="9" ry="4" fill="#0f172a" />
      <!-- Cuadrado oscuro de la etiqueta -->
      <rect x="28" y="27" width="50" height="46" rx="4" fill="#0f2b38" stroke="#004d40" stroke-width="2" />
      <text x="53" y="61" text-anchor="middle" fill="#009688" font-size="32" font-weight="900" font-family="system-ui, sans-serif">A</text>
    </g>
    <!-- Textos -->
    <text x="0" y="150" fill="#0f172a" font-size="44" font-weight="900" font-family="system-ui, sans-serif">1.</text>
    <rect x="38" y="139" width="8" height="8" fill="#009688" />
    <text x="54" y="134" fill="#0f172a" font-size="14" font-weight="600">Bobinado exterior</text>
    <text x="54" y="152" fill="#0f172a" font-size="14" font-weight="600">Salida izquierda</text>
  </g>

  <!-- POSICIÓN 2: Bobinado exterior - Salida derecha -->
  <g transform="translate(275, 105)">
    <g transform="translate(10, 0)">
      <path d="M 112,74 L 112,88 C 112,104 168,104 168,88 L 168,32 Z" fill="#f4511e" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 10,20 L 140,20 C 156,20 168,25 168,32 L 168,74 C 168,80 154,84 132,84 L 112,84 L 112,74 L 10,74 Z" fill="#f4511e" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <ellipse cx="140" cy="32" rx="28" ry="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
      <ellipse cx="140" cy="32" rx="9" ry="4" fill="#0f172a" />
      <rect x="28" y="27" width="50" height="46" rx="4" fill="#0f2b38" stroke="#bf360c" stroke-width="2" />
      <g transform="translate(53, 50) rotate(180)">
        <text x="0" y="12" text-anchor="middle" fill="#f4511e" font-size="32" font-weight="900" font-family="system-ui, sans-serif">A</text>
      </g>
    </g>
    <text x="0" y="150" fill="#0f172a" font-size="44" font-weight="900" font-family="system-ui, sans-serif">2.</text>
    <rect x="42" y="139" width="8" height="8" fill="#f4511e" />
    <text x="58" y="134" fill="#0f172a" font-size="14" font-weight="600">Bobinado exterior</text>
    <text x="58" y="152" fill="#0f172a" font-size="14" font-weight="600">Salida derecha</text>
  </g>

  <!-- POSICIÓN 3: Bobinado exterior - Salida de pie -->
  <g transform="translate(520, 105)">
    <g transform="translate(10, 0)">
      <path d="M 112,74 L 112,88 C 112,104 168,104 168,88 L 168,32 Z" fill="#d81b60" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 10,20 L 140,20 C 156,20 168,25 168,32 L 168,74 C 168,80 154,84 132,84 L 112,84 L 112,74 L 10,74 Z" fill="#d81b60" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <ellipse cx="140" cy="32" rx="28" ry="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
      <ellipse cx="140" cy="32" rx="9" ry="4" fill="#0f172a" />
      <rect x="28" y="27" width="50" height="46" rx="4" fill="#0f2b38" stroke="#880e4f" stroke-width="2" />
      <g transform="translate(53, 50) rotate(-90)">
        <text x="0" y="12" text-anchor="middle" fill="#d81b60" font-size="32" font-weight="900" font-family="system-ui, sans-serif">A</text>
      </g>
    </g>
    <text x="0" y="150" fill="#0f172a" font-size="44" font-weight="900" font-family="system-ui, sans-serif">3.</text>
    <rect x="42" y="139" width="8" height="8" fill="#d81b60" />
    <text x="58" y="134" fill="#0f172a" font-size="14" font-weight="600">Bobinado exterior</text>
    <text x="58" y="152" fill="#0f172a" font-size="14" font-weight="600">Salida de pie</text>
  </g>

  <!-- POSICIÓN 4: Bobinado exterior - Salida cabeza -->
  <g transform="translate(765, 105)">
    <g transform="translate(10, 0)">
      <path d="M 112,74 L 112,88 C 112,104 168,104 168,88 L 168,32 Z" fill="#8bc34a" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 10,20 L 140,20 C 156,20 168,25 168,32 L 168,74 C 168,80 154,84 132,84 L 112,84 L 112,74 L 10,74 Z" fill="#8bc34a" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <ellipse cx="140" cy="32" rx="28" ry="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
      <ellipse cx="140" cy="32" rx="9" ry="4" fill="#0f172a" />
      <rect x="28" y="27" width="50" height="46" rx="4" fill="#0f2b38" stroke="#33691e" stroke-width="2" />
      <g transform="translate(53, 50) rotate(90)">
        <text x="0" y="12" text-anchor="middle" fill="#8bc34a" font-size="32" font-weight="900" font-family="system-ui, sans-serif">A</text>
      </g>
    </g>
    <text x="0" y="150" fill="#0f172a" font-size="44" font-weight="900" font-family="system-ui, sans-serif">4.</text>
    <rect x="42" y="139" width="8" height="8" fill="#8bc34a" />
    <text x="58" y="134" fill="#0f172a" font-size="14" font-weight="600">Bobinado exterior</text>
    <text x="58" y="152" fill="#0f172a" font-size="14" font-weight="600">Salida cabeza</text>
  </g>


  <!-- ======================================================== -->
  <!-- FILA 2: BOBINADO INTERIOR (5, 6, 7, 8)                  -->
  <!-- El papel pasa por DEBAJO de la bobina                    -->
  <!-- ======================================================== -->

  <!-- POSICIÓN 5: Bobinado interior - Salida izquierda -->
  <g transform="translate(30, 390)">
    <g transform="translate(10, 0)">
      <!-- Tira de papel saliendo POR DEBAJO de la bobina (desde la base) -->
      <path d="M 10,50 L 112,50 L 150,50 C 150,88 140,104 140,104 L 10,104 Z" fill="#29b6f6" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Cilindro completo de la bobina dibujado al FRENTE (sobre el papel) -->
      <path d="M 112,32 L 112,88 C 112,104 168,104 168,88 L 168,32 Z" fill="#29b6f6" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Tapa superior del mismo color azul que la bobina con buje negro (bobinado interior) -->
      <ellipse cx="140" cy="32" rx="28" ry="12" fill="#29b6f6" stroke="#0f172a" stroke-width="2.5" />
      <ellipse cx="140" cy="32" rx="9" ry="4" fill="#0f172a" />
      <!-- Cuadrado oscuro de la etiqueta en la banda inferior -->
      <rect x="28" y="55" width="50" height="46" rx="4" fill="#0f2b38" stroke="#01579b" stroke-width="2" />
      <text x="53" y="89" text-anchor="middle" fill="#29b6f6" font-size="32" font-weight="900" font-family="system-ui, sans-serif">A</text>
    </g>
    <text x="0" y="150" fill="#0f172a" font-size="44" font-weight="900" font-family="system-ui, sans-serif">5.</text>
    <rect x="38" y="139" width="8" height="8" fill="#29b6f6" />
    <text x="54" y="134" fill="#0f172a" font-size="14" font-weight="600">Bobinado interior</text>
    <text x="54" y="152" fill="#0f172a" font-size="14" font-weight="600">Salida izquierda</text>
  </g>

  <!-- POSICIÓN 6: Bobinado interior - Salida derecha -->
  <g transform="translate(275, 390)">
    <g transform="translate(10, 0)">
      <path d="M 10,50 L 112,50 L 150,50 C 150,88 140,104 140,104 L 10,104 Z" fill="#8e24aa" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 112,32 L 112,88 C 112,104 168,104 168,88 L 168,32 Z" fill="#8e24aa" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <ellipse cx="140" cy="32" rx="28" ry="12" fill="#8e24aa" stroke="#0f172a" stroke-width="2.5" />
      <ellipse cx="140" cy="32" rx="9" ry="4" fill="#0f172a" />
      <rect x="28" y="55" width="50" height="46" rx="4" fill="#0f2b38" stroke="#4a148c" stroke-width="2" />
      <g transform="translate(53, 78) rotate(180)">
        <text x="0" y="12" text-anchor="middle" fill="#8e24aa" font-size="32" font-weight="900" font-family="system-ui, sans-serif">A</text>
      </g>
    </g>
    <text x="0" y="150" fill="#0f172a" font-size="44" font-weight="900" font-family="system-ui, sans-serif">6.</text>
    <rect x="42" y="139" width="8" height="8" fill="#8e24aa" />
    <text x="58" y="134" fill="#0f172a" font-size="14" font-weight="600">Bobinado interior</text>
    <text x="58" y="152" fill="#0f172a" font-size="14" font-weight="600">Salida derecha</text>
  </g>

  <!-- POSICIÓN 7: Bobinado interior - Salida de pie -->
  <g transform="translate(520, 390)">
    <g transform="translate(10, 0)">
      <path d="M 10,50 L 112,50 L 150,50 C 150,88 140,104 140,104 L 10,104 Z" fill="#fbc02d" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 112,32 L 112,88 C 112,104 168,104 168,88 L 168,32 Z" fill="#fbc02d" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <ellipse cx="140" cy="32" rx="28" ry="12" fill="#fbc02d" stroke="#0f172a" stroke-width="2.5" />
      <ellipse cx="140" cy="32" rx="9" ry="4" fill="#0f172a" />
      <rect x="28" y="55" width="50" height="46" rx="4" fill="#0f2b38" stroke="#f57f17" stroke-width="2" />
      <g transform="translate(53, 78) rotate(-90)">
        <text x="0" y="12" text-anchor="middle" fill="#fbc02d" font-size="32" font-weight="900" font-family="system-ui, sans-serif">A</text>
      </g>
    </g>
    <text x="0" y="150" fill="#0f172a" font-size="44" font-weight="900" font-family="system-ui, sans-serif">7.</text>
    <rect x="42" y="139" width="8" height="8" fill="#fbc02d" />
    <text x="58" y="134" fill="#0f172a" font-size="14" font-weight="600">Bobinado interior</text>
    <text x="58" y="152" fill="#0f172a" font-size="14" font-weight="600">Salida de pie</text>
  </g>

  <!-- POSICIÓN 8: Bobinado interior - Salida cabeza -->
  <g transform="translate(765, 390)">
    <g transform="translate(10, 0)">
      <path d="M 10,50 L 112,50 L 150,50 C 150,88 140,104 140,104 L 10,104 Z" fill="#c62828" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 112,32 L 112,88 C 112,104 168,104 168,88 L 168,32 Z" fill="#c62828" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
      <ellipse cx="140" cy="32" rx="28" ry="12" fill="#c62828" stroke="#0f172a" stroke-width="2.5" />
      <ellipse cx="140" cy="32" rx="9" ry="4" fill="#0f172a" />
      <rect x="28" y="55" width="50" height="46" rx="4" fill="#0f2b38" stroke="#b71c1c" stroke-width="2" />
      <g transform="translate(53, 78) rotate(90)">
        <text x="0" y="12" text-anchor="middle" fill="#c62828" font-size="32" font-weight="900" font-family="system-ui, sans-serif">A</text>
      </g>
    </g>
    <text x="0" y="150" fill="#0f172a" font-size="44" font-weight="900" font-family="system-ui, sans-serif">8.</text>
    <rect x="42" y="139" width="8" height="8" fill="#c62828" />
    <text x="58" y="134" fill="#0f172a" font-size="14" font-weight="600">Bobinado interior</text>
    <text x="58" y="152" fill="#0f172a" font-size="14" font-weight="600">Salida cabeza</text>
  </g>
</svg>
