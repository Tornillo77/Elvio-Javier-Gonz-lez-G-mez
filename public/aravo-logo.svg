<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background subtle radial glow -->
    <radialGradient id="aravo-bg-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Main cyan-to-electric-blue gradient for the left stroke -->
    <linearGradient id="aravo-grad-left" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="85%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <!-- Right stroke & Ascending Arrow gradient -->
    <linearGradient id="aravo-grad-right" x1="10%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Arrow head highlight gradient -->
    <linearGradient id="aravo-grad-arrow" x1="20%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Inner shadow / bevel gradient -->
    <linearGradient id="aravo-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="aravo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow circle in dark theme -->
  <circle cx="60" cy="58" r="48" fill="url(#aravo-bg-glow)" />

  <g filter="url(#aravo-glow)">
    <!-- LEFT WING OF THE 'A': Strong upward beam -->
    <path
      d="M 28 92
         L 19 92
         C 17.5 92 16.5 90.8 17.2 89.4
         L 54 18.5
         C 55.2 16.2 58.5 16.2 59.7 18.5
         L 67.5 33.5
         L 57 53
         L 44.5 76
         L 39 86.5
         C 38.2 88.2 36.8 92 28 92 Z"
      fill="url(#aravo-grad-left)"
    />

    <!-- RIGHT WING & ASCENDING ARROW: Geometric upward flight -->
    <!-- Lower right leg / base -->
    <path
      d="M 68 92
         L 96.5 92
         C 98.2 92 99.2 90.5 98.3 88.9
         L 79.5 54.5
         L 68 54.5
         L 58 72
         L 53 82
         C 51 86 54 92 68 92 Z"
      fill="url(#aravo-grad-right)"
    />

    <!-- DYNAMIC ASCENDING ARROW / CROSSBAR CUTOUT: Rising towards the upper right -->
    <path
      d="M 47 62
         L 62.5 33
         C 63.8 30.5 67.2 30.5 68.5 33
         L 83 60
         L 73.5 60
         L 65.5 45
         L 57.5 60
         L 54 62 Z"
      fill="url(#aravo-grad-arrow)"
    />

    <!-- CENTRAL PRISM SHARD (Dynamic energy core) -->
    <polygon
      points="60,24 65.5,34 54.5,34"
      fill="#e0f2fe"
      opacity="0.95"
    />
  </g>
</svg>
